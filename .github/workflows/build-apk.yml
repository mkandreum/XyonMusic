name: Build release APK (R8)

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Keystore opcional (secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          printf "storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
      - name: Assemble release (R8)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -o pipefail
          gradle :app:assembleRelease 2>&1 | tee build.log
      - name: Errores de compilación
        if: failure()
        run: |
          grep -E "^e: |error:|ERROR" build.log | head -80
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk XyonMusic-${{ github.run_number }}-r8.apk
      - uses: actions/upload-artifact@v4
        with:
          name: XyonMusic-release-r8
          path: XyonMusic-*-r8.apk
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && format('XyonMusic {0}', github.ref_name) || format('XyonMusic build {0} (R8)', github.run_number) }}
          body_path: ${{ github.ref_type == 'tag' && 'RELEASE_NOTES.md' || '' }}
          make_latest: ${{ github.ref_type == 'tag' }}
          target_commitish: ${{ github.sha }}
          files: XyonMusic-*-r8.apk
