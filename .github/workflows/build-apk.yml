name: Build release APK (R8)

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Versión a publicar (p. ej. v2.0)"
        required: false
        default: ""
      source_ref:
        description: "Commit/tag a compilar (vacío = el actual)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Firma instalable en versiones antiguas
        if: inputs.source_ref != ''
        run: |
          sed -i 's/if (keystoreProps.containsKey("storeFile")) signingConfig = signingConfigs.getByName("release")/signingConfig = signingConfigs.getByName(if (keystoreProps.containsKey("storeFile")) "release" else "debug")/' app/build.gradle.kts
          grep -q "suppressUnsupportedCompileSdk" gradle.properties || echo "android.suppressUnsupportedCompileSdk=35" >> gradle.properties
          grep -n signingConfig app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Keystore opcional (secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          printf "storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
      - name: Assemble release (R8)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -o pipefail
          gradle :app:assembleRelease 2>&1 | tee build.log
      - name: Errores de compilación
        if: failure()
        run: |
          grep -E "^e: |error:|ERROR" build.log | head -80
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk XyonMusic-${{ github.run_number }}-r8.apk
      - uses: actions/upload-artifact@v4
        with:
          name: XyonMusic-release-r8
          path: XyonMusic-*-r8.apk
      - name: Publish GitHub Release
        env:
          REL_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.REL_TAG != '' && env.REL_TAG || format('build-{0}', github.run_number) }}
          name: ${{ env.REL_TAG != '' && format('XyonMusic {0}', env.REL_TAG) || format('XyonMusic build {0} (R8)', github.run_number) }}
          body_path: ${{ env.REL_TAG != '' && inputs.source_ref == '' && 'RELEASE_NOTES.md' || '' }}
          make_latest: ${{ env.REL_TAG != '' }}
          target_commitish: ${{ github.sha }}
          body: ${{ inputs.source_ref != '' && format('APK compilado desde {0} sin cambios de código (solo firma instalable).', inputs.source_ref) || '' }}
          files: XyonMusic-*-r8.apk
